# /home/djx/game/gradle/wrapper/gradle-wrapper.properties
#
# distributionUrl 为什么不是官方的 https://services.gradle.org/distributions/...
#   因为实测这台机器【完全连不上 github.com】（curl 返回 000），
#   而 Gradle 官方分发地址会 307 跳转到 github.com/gradle/gradle-distributions，
#   用官方地址会直接卡死下不动。
#   所以指向阿里云镜像。已实测该文件 sha256 与 Gradle 官方公布值完全一致：
#     acd53f1edaf02f1a8ff99879f8a34b302661a057d9b063ae9e35b552f804d20a
#   下面的 distributionSha256Sum 就是这道校验，下载被篡改或下到半截会直接报错。
#
# 版本说明：9.7.1 是 services.gradle.org/versions/current 返回的当前版本，
#           与 AGP 9.3.3 已实测搭配构建成功。

distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://mirrors.aliyun.com/macports/distfiles/gradle/gradle-9.7.1-bin.zip
distributionSha256Sum=acd53f1edaf02f1a8ff99879f8a34b302661a057d9b063ae9e35b552f804d20a
networkTimeout=30000
retries=3
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
