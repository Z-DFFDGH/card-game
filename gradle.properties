# /home/djx/game/gradle.properties
# 作用：Gradle 全局参数 + 本工程用到的版本号。

# libGDX 版本。core 和 android 后端都用这一个变量，保证版本一致。
# 实测 Maven Central（及阿里云 public 镜像）上的最新稳定版是 1.14.2。
gdxVersion=1.14.2

# 构建 JVM 参数
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true

# 关闭配置缓存：android 模块里有个自定义的 natives 解压任务，
# 关掉可以少一类玄学报错。以后想开改成 true。
org.gradle.configuration-cache=false

# libGDX 的 android 后端依赖 androidx.core，必须打开
android.useAndroidX=true
